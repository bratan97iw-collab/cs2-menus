name: Build Game Utils for Metamod 1483 (API 18)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - name: Checkout Game Utils source
        uses: actions/checkout@v4

      - name: Install build prerequisites
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y git clang python3 python3-pip python3-venv build-essential pkg-config protobuf-compiler libprotobuf-dev zip
          python3 -m venv "$RUNNER_TEMP/ambuild-venv"
          "$RUNNER_TEMP/ambuild-venv/bin/python" -m pip install git+https://github.com/alliedmodders/ambuild.git
          echo "$RUNNER_TEMP/ambuild-venv/bin" >> "$GITHUB_PATH"

      - name: Fetch Metamod 1483, CS2 SDK and HL2SDK manifests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p external
          git clone https://github.com/alliedmodders/metamod-source.git external/metamod-source
          git -C external/metamod-source checkout 170058a
          git -C external/metamod-source submodule update --init --recursive
          git clone --recursive --branch cs2 https://github.com/alliedmodders/hl2sdk.git external/hl2sdk-cs2
          git clone https://github.com/alliedmodders/hl2sdk-manifests.git ../hl2sdk-manifests
          git clone https://github.com/Pisex/SchemaEntity.git ../SchemaEntity
          test -f ../hl2sdk-manifests/SdkHelpers.ambuild
          echo "Manifest exists: $(realpath ../hl2sdk-manifests/SdkHelpers.ambuild)"
          ls -la ../hl2sdk-manifests/SdkHelpers.ambuild

      - name: Configure AMBuild
        shell: bash
        env:
          HL2SDK_ROOT: ${{ github.workspace }}/external
          MMS_PATH: ${{ github.workspace }}/external/metamod-source
        run: |
          set -euo pipefail
          mkdir -p build
          cd build
          "$RUNNER_TEMP/ambuild-venv/bin/python" ../configure.py \
            -s cs2 --targets x86_64 --enable-optimize \
            --hl2sdk-manifests=../hl2sdk-manifests \
            --mms_path="$MMS_PATH" --hl2sdk-root="$HL2SDK_ROOT"

      - name: Compile Game Utils
        shell: bash
        working-directory: build
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/ambuild-venv/bin/ambuild"

      - name: Upload experimental compiled files
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: game-utils-api18-experimental
          path: |
            build/**/*.so
            build/**/*.vdf
          if-no-files-found: error
